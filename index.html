<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Ligas de Fútbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Contenedor Principal -->
  <div class="contenedor">
    <!-- Navegación de Secciones -->
    <div class="tabs">
      <button id="tab-ligas" class="tab active">Ligas</button>
      <button id="tab-equipos" class="tab">Equipos</button>
      <button id="tab-jugadores" class="tab">Jugadores</button>
    </div>

    <!-- Secciones -->
    <div id="ligas" class="seccion active">
      <h2>Ligas</h2>
      <button id="agregar-liga-btn">Agregar Liga</button>
      <ul id="lista-ligas"></ul>
      <div id="formulario-liga">
        <input type="text" id="nombre-liga" placeholder="Nombre de la Liga">
        <button id="guardar-liga-btn">Guardar Liga</button>
      </div>
    </div>

    <div id="equipos" class="seccion">
      <h2>Equipos</h2>
      <button id="agregar-equipo-btn">Agregar Equipo</button>
      <ul id="lista-equipos"></ul>
      <div id="formulario-equipo">
        <input type="text" id="nombre-equipo" placeholder="Nombre del Equipo">
        <button id="guardar-equipo-btn">Guardar Equipo</button>
      </div>
    </div>

    <div id="jugadores" class="seccion">
      <h2>Jugadores</h2>
      <button id="agregar-jugador-btn">Agregar Jugador</button>
      <ul id="lista-jugadores"></ul>
      <div id="formulario-jugador">
        <input type="text" id="nombre-jugador" placeholder="Nombre del Jugador">
        <input type="text" id="posicion-jugador" placeholder="Posición">
        <button id="guardar-jugador-btn">Guardar Jugador</button>
      </div>
    </div>

    <!-- Botón para modo oscuro -->
    <button onclick="toggleDarkMode()">Modo Oscuro</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
